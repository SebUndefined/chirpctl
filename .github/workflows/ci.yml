
name: CI/CD

on:
  pull_request:
    branches:
      - main
      - staging

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests and validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

      - name: Run Go vet
        run: make vet

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser configuration
        run: make release-check

  release:
    name: Publish release
    needs: test

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: chirpctl-release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Validate release configuration
        run: make release-check

      - name: Verify cross-platform builds
        run: make snapshot

      - name: Determine semantic version
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: "true"

      - name: Checkout release tag
        if: steps.semrel.outputs.version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          git fetch --tags --force
          git -c advice.detachedHead=false checkout "v${RELEASE_VERSION}"

      - name: Publish GitHub release artifacts
        if: steps.semrel.outputs.version != ''
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
