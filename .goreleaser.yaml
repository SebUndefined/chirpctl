
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2
project_name: chirpctl
builds:
  - id: chirpctl
    main: .
    binary: chirpctl

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    flags:
      - -trimpath

    mod_timestamp: "{{ .CommitTimestamp }}"

    ldflags:
      - >-
        -s -w
        -X github.com/sebundefined/chirpctl/internal/build.Version={{ .Version }}
        -X github.com/sebundefined/chirpctl/internal/build.Date={{ .CommitDate }}
archives:
  - id: chirpctl-archives
    ids:
      - chirpctl

    name_template: "chirpctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: "chirpctl_{{ .Version }}_checksums.txt"
  algorithm: sha256
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
